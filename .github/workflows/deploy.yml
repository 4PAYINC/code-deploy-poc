name: Deploy to AWS server

# This workflow is intended for a runner that can reach the VPN-protected AWS server.
# If your AWS host is only accessible through a VPN, use a self-hosted runner inside that network
# or add VPN connection/setup steps here before the scp/ssh steps.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy on main push
    runs-on: [self-hosted, linux]
    env:
      SOURCE_PATH: ./test-deploy.txt
      REMOTE_PATH: /var/www/tmp/github-poc/
      REMOTE_USER: phpadm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy files to AWS server via SSH/SCP
        run: |
          scp -o StrictHostKeyChecking=no -r $SOURCE_PATH $REMOTE_USER@${{ secrets.AWS_SERVER_HOST }}:$REMOTE_PATH

      - name: Run deployment commands on AWS server
        run: |
          ssh -o StrictHostKeyChecking=no $REMOTE_USER@${{ secrets.AWS_SERVER_HOST }} <<'EOF'
            cd $REMOTE_PATH
            # Add any post-copy commands below
            # e.g. sudo systemctl restart myapp
          EOF
